<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ScriptHub browser icon</title>
  <desc id="desc">Compact ScriptHub favicon with terminal and play symbol, optimized for dark browser themes.</desc>
  <defs>
    <linearGradient id="frame" x1="72" y1="48" x2="432" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="play" x1="284" y1="276" x2="410" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Transparent outside area -->
  <path d="M256 26 448 137a36 36 0 0 1 18 31v176a36 36 0 0 1-18 31L256 486a36 36 0 0 1-36 0L28 375a36 36 0 0 1-18-31V168a36 36 0 0 1 18-31L220 26a36 36 0 0 1 36 0Z" fill="url(#frame)"/>

  <path d="M256 60 416 152a26 26 0 0 1 13 23v162a26 26 0 0 1-13 23L256 452a26 26 0 0 1-26 0L70 360a26 26 0 0 1-13-23V175a26 26 0 0 1 13-23L230 60a26 26 0 0 1 26 0Z" fill="#06152F"/>

  <!-- Simplified terminal -->
  <rect x="102" y="143" width="292" height="210" rx="34" fill="#081F42" stroke="#7DD3FC" stroke-width="12"/>
  <path d="M102 192h292" stroke="#7DD3FC" stroke-width="12"/>
  <circle cx="135" cy="168" r="10" fill="#FB7185"/>
  <circle cx="168" cy="168" r="10" fill="#FBBF24"/>
  <circle cx="201" cy="168" r="10" fill="#34D399"/>

  <!-- Command prompt, chunky for small sizes -->
  <path d="m146 238 31 28-31 28" fill="none" stroke="#22D3EE" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M208 294h72" stroke="#A78BFA" stroke-width="18" stroke-linecap="round"/>
  <path d="M208 238h104" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>

  <!-- Play badge -->
  <circle cx="360" cy="350" r="82" fill="url(#play)" stroke="#99F6E4" stroke-width="10"/>
  <path d="m337 307 67 43-67 43Z" fill="#fff"/>
</svg>
