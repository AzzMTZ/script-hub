<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ScriptHub logo</title>
  <desc id="desc">Modern blue ScriptHub logo with a terminal and play symbol.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(48 38)">
    <path d="M140 4 257 72a24 24 0 0 1 12 21v136a24 24 0 0 1-12 21l-117 68a24 24 0 0 1-24 0L-1 250a24 24 0 0 1-12-21V93A24 24 0 0 1-1 72L116 4a24 24 0 0 1 24 0Z" fill="url(#g)"/>
    <path d="M140 29 235 84a18 18 0 0 1 9 16v122a18 18 0 0 1-9 16l-95 55a18 18 0 0 1-18 0l-95-55a18 18 0 0 1-9-16V100a18 18 0 0 1 9-16l95-55a18 18 0 0 1 18 0Z" fill="#071A3A" opacity=".94"/>

    <!-- terminal -->
    <rect x="48" y="91" width="174" height="132" rx="18" fill="#0B2A58" stroke="#60A5FA" stroke-width="5"/>
    <path d="M48 119h174" stroke="#60A5FA" stroke-width="5"/>
    <circle cx="67" cy="105" r="6" fill="#FB7185"/>
    <circle cx="87" cy="105" r="6" fill="#FBBF24"/>
    <circle cx="107" cy="105" r="6" fill="#34D399"/>
    <path d="m76 151 18 16-18 16" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M111 184h45" stroke="#A78BFA" stroke-width="9" stroke-linecap="round"/>
    <path d="M111 151h66" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>

    <!-- play -->
    <circle cx="210" cy="207" r="48" fill="url(#play)" stroke="#99F6E4" stroke-width="4"/>
    <path d="m196 181 39 26-39 26Z" fill="#fff"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="750" font-size="122" letter-spacing="-5">
    <text x="370" y="218" fill="#0B1F44">Script</text>
    <text x="700" y="218" fill="#2563EB">Hub</text>
  </g>
  <text x="378" y="273" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500" letter-spacing="4" fill="#64748B">RUN • AUTOMATE • SCALE</text>
</svg>
