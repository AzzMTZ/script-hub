services:
  postgres:
    image: postgres:16-alpine
    container_name: script-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scripthub
      POSTGRES_PASSWORD: scripthub
      POSTGRES_DB: scripthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scripthub -d scripthub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
