services:
    postgres:
        image: postgres:16-alpine
        container_name: script-hub-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: scripthub
            POSTGRES_PASSWORD: scripthub
            POSTGRES_DB: scripthub
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U scripthub -d scripthub']
            interval: 5s
            timeout: 5s
            retries: 5

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        container_name: script-hub-elasticsearch
        restart: unless-stopped
        environment:
            discovery.type: single-node
            xpack.security.enabled: 'false'
            ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
            - '9200:9200'
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 10

    kibana:
        image: docker.elastic.co/kibana/kibana:8.15.0
        container_name: script-hub-kibana
        restart: unless-stopped
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
        ports:
            - '5601:5601'
        healthcheck:
            test: ['CMD-SHELL', 'curl -sf http://localhost:5601/api/status || exit 1']
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
    elasticsearch_data:
